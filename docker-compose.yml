version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: poor_to_rich_mariadb
    ports:
      - "${DB_BINDING_PORT}:${DB_PORT}"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
    volumes:
      - mariadb_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: poor_to_rich_redis
    ports:
      - "${REDIS_BINDING_PORT:-6379}:${REDIS_PORT}"
    volumes:
      - redis_data:/var/lib/redis

  k6:
    image: grafana/k6:latest
    container_name: poor_to_rich_k6
    profiles: ["k6"]
    environment:
      - BASE_URL=http://app:8080
      - JWT_TOKEN=${K6_JWT_TOKEN:-}
      - LOGIN_PASSWORD=${LOGIN_PASSWORD:-}
    volumes:
      - ./k6/scripts:/scripts
    depends_on:
      - app
    command: run /scripts/ranking_scheduler_latency.js

  app:
    build: .
    container_name: poor_to_rich_application
    depends_on:
      - db
      - redis
    ports:
      - "${APP_BINDING_PORT}:${APP_PORT}"
    environment:
      TZ: Asia/Seoul
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx384m -Duser.timezone=Asia/Seoul}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAKAO_KEY: ${KAKAO_KEY}
      KAKAO_SECRET: ${KAKAO_SECRET}
      KAKAO_ADMIN: ${KAKAO_ADMIN}
    env_file:
      - .env

volumes:
  mariadb_data:
  redis_data:
